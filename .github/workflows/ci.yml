name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / gfortran ${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: its job fails during the build and that
        # has not been investigated yet. gfortran 13 is
        # absent too: it hits an internal compiler error on src/safetensors.f90.
        os: [ubuntu-latest]
        gcc: [14, 15]
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran and fpm
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gcc
          version: ${{ matrix.gcc }}

      - uses: fortran-lang/setup-fpm@v7
        with:
          fpm-version: 'v0.13.0'

      - name: Build
        run: fpm build

      - name: Test
        run: fpm test

      - name: Test with runtime checks (-fcheck=all -Wall)
        run: fpm test --profile debug --flag "-Wall -Wextra -fcheck=all -fbacktrace -finit-real=snan"

      - name: Byte-for-byte parity against the fixtures (cmp)
        run: bash test/parity_cmp.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the official implementation
        run: python -m pip install numpy safetensors

      - name: Regenerate the fixtures with the official writer and compare
        run: |
          python tools/make_fixtures.py --out /tmp/st_fixtures_ci
          cmp /tmp/st_fixtures_ci/parity_oracle.safetensors test/fixtures/parity_oracle.safetensors
          cmp /tmp/st_fixtures_ci/escapes_oracle.safetensors test/fixtures/escapes_oracle.safetensors
          echo "fixtures regenerated by the official library are byte-identical"

      - name: Fortran writes, the official library reads
        run: |
          f=$(find . -name to_python.safetensors -print -quit)
          test -n "$f" || { echo "the test artifact was not produced"; exit 1; }
          echo "verifying $f"
          python tools/reference_writer.py --verify "$f"

      - name: Adapter smoke test on a synthetic checkpoint
        run: |
          python - <<'PY'
          import os
          import numpy as np
          d = "/tmp/synth_ckpt"
          os.makedirs(d, exist_ok=True)
          with open(os.path.join(d, "arch.txt"), "w") as fh:
              fh.write("d_model = 8\nn_head = 2\nn_kv = 1\nn_layer = 2\nvocab = 16\nctx = 32\n")
          rng = np.random.default_rng(0)
          np.save(os.path.join(d, "transformer_wte_weight.npy"), rng.standard_normal(16 * 8, dtype=np.float32))
          np.save(os.path.join(d, "lm_head_weight.npy"), rng.standard_normal(16 * 8, dtype=np.float32))
          for layer in range(2):
              for name in ("attn_c_q", "attn_c_k", "attn_c_v", "attn_c_proj", "mlp_c_fc", "mlp_c_proj"):
                  np.save(os.path.join(d, "transformer_h_%d_%s_weight.npy" % (layer, name)),
                          rng.standard_normal(64, dtype=np.float32))
          PY
          python tools/npy_to_safetensors.py /tmp/synth_ckpt /tmp/synth.safetensors
          python -c "from safetensors import safe_open; f = safe_open('/tmp/synth.safetensors', framework='numpy'); print(sorted(f.keys())); print(sorted(f.metadata())[:5])"
          python tools/verify_npy_vs_st.py /tmp/synth_ckpt /tmp/synth.safetensors
